# ------------------------------------------------------------
# Payment Processing System configuration.
#
# The JDBC URL can be overridden by an environment variable.
# AWS database credentials are retrieved from Secrets Manager.
# ------------------------------------------------------------

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/paymentdb}

app.aws.secret-name=${AWS_SECRET_NAME:payment-processing/rds}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true